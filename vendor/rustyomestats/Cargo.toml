[package]
name         = "rustyomestats"
version      = "0.2.0"
edition      = "2021"
# Pure stat kernels (compute_nl, codon counts, n_stat) build on 1.75.
# The `full` feature (CLI + polars/bio CSV output + FragGeneScan) needs 1.85.
rust-version = "1.75"
authors      = ["Richard Allen White III <raw937@gmail.com>"]
license      = "MIT"
description  = "Fast genome statistics: length, GC, N/L, 6-frame and FragGeneScan codon density, plus Castro U50 assembly metrics."
homepage     = "https://github.com/raw937/rustyomestats"
repository   = "https://github.com/raw937/rustyomestats"

[lib]
name = "rustyomestats"
path = "src/lib.rs"

[[bin]]
name = "rustyomestats"
path = "src/main.rs"
required-features = ["full"]

[dependencies]
clap   = { version = "4",    features = ["derive"], optional = true }
bio    = { version = "2.0",  optional = true }
polars = { version = "0.46", features = ["lazy", "csv"], optional = true }
rayon  = { version = "1.10", optional = true }
anyhow = { version = "1.0",  optional = true }

[features]
default = []
# Everything the standalone CLI needs (CSV output, FASTA I/O, codon density CSVs,
# U50-from-BED, FragGeneScan ORF prediction). Requires rustc >= 1.85.
full = ["dep:clap", "dep:bio", "dep:polars", "dep:rayon", "dep:anyhow"]
